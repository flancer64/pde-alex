name: LIVE - Build & Deploy PDE Alex

on: workflow_dispatch

env:
  APP_DIR: ${{ vars.APP_DIR }}
  APP_ROOT: app/pde-alex
  PRJ: pde-alex
  SERVICE: pde-alex.service

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the application repository
        uses: actions/checkout@v5
        with:
          path: ${{ env.APP_ROOT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Authorize GitHub package sources
        run: git config --global url."https://x-access-token:${{ secrets.PDE_PACKAGES_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install production dependencies
        working-directory: ${{ env.APP_ROOT }}
        run: npm install --install-links --omit=dev --omit=optional

      - name: Build deployment archive
        working-directory: ${{ env.APP_ROOT }}
        run: zip -qq -r "${{ env.PRJ }}.zip" . -x '.git/*' '.env' 'var/*'

      - name: Upload deployment archive
        uses: actions/upload-artifact@v4
        with:
          name: app-archive
          path: ${{ env.APP_ROOT }}/${{ env.PRJ }}.zip
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download deployment archive
        uses: actions/download-artifact@v4
        with:
          name: app-archive
          path: .

      - name: Validate SSH connection
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            pwd
            whoami

      - name: Copy deployment archive to the server
        uses: appleboy/scp-action@master
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: ${{ env.PRJ }}.zip
          target: ${{ env.APP_DIR }}

      - name: Switch the application release
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            cd "${{ env.APP_DIR }}"
            rm -rf prod.new
            mkdir -p prod.new
            unzip -qq "${{ env.PRJ }}.zip" -d prod.new

            TIMESTAMP="$(date +%Y%m%d-%H%M%S)"

            sudo /bin/systemctl stop "${{ env.SERVICE }}" || true

            rm -rf prod.old
            if [ -d prod ]; then
              mv prod prod.old
            else
              mkdir -p prod.old
            fi

            mv prod.new prod

            if [ -f prod.old/.env ]; then
              cp prod.old/.env prod/.env
            fi

            if [ -d prod.old/var ]; then
              mkdir -p prod/var
              cp -a prod.old/var/. prod/var/
            fi

            mv "${{ env.PRJ }}.zip" "${{ env.PRJ }}-${TIMESTAMP}.zip"

            sudo /bin/systemctl start "${{ env.SERVICE }}"
            systemctl is-active --quiet "${{ env.SERVICE }}"
            ls -lh "${{ env.APP_DIR }}"
